<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiking Compass UI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f1923;
            color: #e8f4f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .device {
            width: 360px;
            background: #141f2b;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.07);
        }

        /* Status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .status-bar .signal {
            display: flex; gap: 3px; align-items: flex-end;
        }
        .signal-bar {
            width: 4px;
            background: #4ade80;
            border-radius: 2px;
        }
        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
            color: #e8f4f0;
            letter-spacing: 0.5px;
        }
        .battery {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; color: #94a3b8;
        }
        .battery-icon {
            width: 22px; height: 11px;
            border: 1.5px solid #94a3b8;
            border-radius: 2px;
            position: relative;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -5px; top: 50%;
            transform: translateY(-50%);
            width: 3px; height: 5px;
            background: #94a3b8;
            border-radius: 0 1px 1px 0;
        }
        .battery-fill {
            position: absolute;
            left: 2px; top: 2px; bottom: 2px;
            width: 70%;
            background: #4ade80;
            border-radius: 1px;
        }

        /* Compass section */
        .compass-wrapper {
            display: flex;
            justify-content: center;
            margin: 8px 0 20px;
            position: relative;
        }

        .compass-outer {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1e2e3e, #0d1820);
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 40px rgba(74,222,128,0.08), inset 0 0 30px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tick marks */
        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(255,255,255,0.2);
            transform-origin: 50% 110px;
            left: calc(50% - 1px);
            top: 0;
        }
        .tick.major {
            height: 16px;
            width: 2.5px;
            background: rgba(255,255,255,0.45);
        }

        /* Cardinal labels */
        .cardinal {
            position: absolute;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #94a3b8;
        }
        .cardinal.north { top: 14px; left: 50%; transform: translateX(-50%); color: #f87171; }
        .cardinal.south { bottom: 14px; left: 50%; transform: translateX(-50%); }
        .cardinal.east  { right: 14px; top: 50%; transform: translateY(-50%); }
        .cardinal.west  { left: 14px;  top: 50%; transform: translateY(-50%); }

        /* Compass rose (rotates) */
        .compass-rose {
            width: 160px;
            height: 160px;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Needle */
        .needle {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -100%);
            width: 0;
            height: 0;
        }
        .needle-north {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 72px;
            background: linear-gradient(to bottom, #f87171, #ef4444);
            clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);
            transform-origin: bottom center;
            filter: drop-shadow(0 0 6px rgba(239,68,68,0.5));
        }
        .needle-south {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 72px;
            background: linear-gradient(to bottom, #e2e8f0, #94a3b8);
            clip-path: polygon(50% 100%, 100% 0%, 50% 20%, 0% 0%);
            transform-origin: top center;
        }
        .needle-center {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #e2e8f0, #64748b);
            border-radius: 50%;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        /* Heading display */
        .heading-display {
            text-align: center;
            margin-bottom: 18px;
        }
        .heading-degrees {
            font-size: 42px;
            font-weight: 700;
            color: #e8f4f0;
            line-height: 1;
            letter-spacing: -1px;
        }
        .heading-degrees span {
            font-size: 22px;
            color: #4ade80;
        }
        .heading-label {
            font-size: 13px;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: #1a2635;
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-icon {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #e8f4f0;
            line-height: 1.1;
        }
        .stat-label {
            font-size: 10px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 3px;
        }

        /* Coordinates bar */
        .coords-bar {
            background: #1a2635;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .coords-dot {
            width: 8px; height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #4ade80; }
            50% { opacity: 0.5; box-shadow: 0 0 4px #4ade80; }
        }
        .coords-text {
            font-size: 13px;
            color: #94a3b8;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 20px rgba(34,197,94,0.25);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(34,197,94,0.35);
        }
        .btn-secondary {
            background: #1a2635;
            color: #64748b;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            color: #94a3b8;
            background: #1e2e3e;
        }
    </style>
</head>
<body>
    <div class="device">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="signal">
                <div class="signal-bar" style="height:5px"></div>
                <div class="signal-bar" style="height:8px"></div>
                <div class="signal-bar" style="height:11px"></div>
                <div class="signal-bar" style="height:14px"></div>
            </div>
            <div class="time" id="clock">10:30 AM</div>
            <div class="battery">
                <div class="battery-icon"><div class="battery-fill"></div></div>
                <span>72%</span>
            </div>
        </div>

        <!-- Compass -->
        <div class="compass-wrapper">
            <div class="compass-outer" id="compassOuter">
                <!-- Tick marks -->
                <script>
                    // Rendered by JS below
                </script>
                <!-- Cardinals -->
                <div class="cardinal north">N</div>
                <div class="cardinal south">S</div>
                <div class="cardinal east">E</div>
                <div class="cardinal west">W</div>

                <div class="compass-rose" id="compassRose">
                    <div class="needle-north"></div>
                    <div class="needle-south"></div>
                    <div class="needle-center"></div>
                </div>
            </div>
        </div>

        <!-- Heading -->
        <div class="heading-display">
            <div class="heading-degrees" id="headingDeg">347<span>°</span></div>
            <div class="heading-label">North-Northwest</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">⬆</div>
                <div class="stat-value">250</div>
                <div class="stat-label">Elev (ft)</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-value">2.4</div>
                <div class="stat-label">mph</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">◉</div>
                <div class="stat-value">0.8</div>
                <div class="stat-label">mi done</div>
            </div>
        </div>

        <!-- Coordinates -->
        <div class="coords-bar">
            <div class="coords-dot"></div>
            <div class="coords-text">40.7128° N &nbsp;|&nbsp; 74.0060° W</div>
        </div>

        <!-- Buttons -->
        <div class="btn-row">
            <button class="btn-primary" id="navBtn">▶  Start Navigation</button>
            <button class="btn-secondary">↩ Back</button>
        </div>
    </div>

    <script>
        // Live clock
        function updateClock() {
            const now = new Date();
            let h = now.getHours(), m = now.getMinutes();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').textContent =
                `${h}:${String(m).padStart(2,'0')} ${ampm}`;
        }
        updateClock();
        setInterval(updateClock, 10000);

        // Add tick marks programmatically
        const outer = document.getElementById('compassOuter');
        for (let i = 0; i < 72; i++) {
            const tick = document.createElement('div');
            tick.className = 'tick' + (i % 9 === 0 ? ' major' : '');
            tick.style.transform = `rotate(${i * 5}deg) translateY(0)`;
            outer.appendChild(tick);
        }

        // Simulate compass heading
        let heading = 347;
        const rose = document.getElementById('compassRose');

        function updateCompass(deg) {
            rose.style.transform = `rotate(${-deg}deg)`;
            document.getElementById('headingDeg').innerHTML =
                `${Math.round(deg)}<span>°</span>`;
        }
        updateCompass(heading);

        // Gently drift the heading for demo
        let drift = 0;
        setInterval(() => {
            drift += (Math.random() - 0.5) * 1.5;
            drift = Math.max(-8, Math.min(8, drift));
            updateCompass(heading + drift);
        }, 1200);

        // Button toggle
        let navigating = false;
        document.getElementById('navBtn').addEventListener('click', function() {
            navigating = !navigating;
            this.textContent = navigating ? '■  Stop Navigation' : '▶  Start Navigation';
            this.style.background = navigating
                ? 'linear-gradient(135deg, #ef4444, #b91c1c)'
                : 'linear-gradient(135deg, #22c55e, #16a34a)';
            this.style.boxShadow = navigating
                ? '0 4px 20px rgba(239,68,68,0.25)'
                : '0 4px 20px rgba(34,197,94,0.25)';
        });
    </script>
</body>
</html>
